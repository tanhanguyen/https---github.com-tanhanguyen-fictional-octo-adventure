server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html so client-side routes (react-router)
    # resolve on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls are reverse-proxied to the backend container (compose service name `api`).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long polls / streaming from the dashboard shouldn't be cut off early.
        proxy_read_timeout 300s;
    }
}
