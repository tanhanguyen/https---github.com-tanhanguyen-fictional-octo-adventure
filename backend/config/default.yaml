# Seed config — checked-in defaults + schema documentation (DB is runtime source of truth).
# Mirrors bot.config.models.BotConfig. D2: single parameter set, SYMBOL_TYPE=FOREX, TIMEFRAME=1H.
symbol: EURUSD
symbol_type: FOREX
timeframe: "1H"
starting_equity: 500.0
trading_day_rollover_tz: America/New_York   # C3
trading_day_rollover_time: "17:00"

risk:
  max_risk_per_trade_pct: 1.0               # C7
  retest_tolerance_mode: atr                # D5
  retest_tolerance_atr_mult: 0.25
  retest_tolerance_percent: 0.003
  retest_max_bars: 5                        # C6
  intrabar_priority: sl_first
  cancel_if_open_beyond_sl: true
  allow_short: true

strategies:
  breakout:
    enabled: true
    range_period: 30                          # spec_v2 §3 (M15/H1); HTF wants 12-15 via profile
    tp1_r: 1.5
    tp2_r: 3.0
    partial_fraction: 0.5
    require_second_breakout: true            # BRB (docs/spec_v2.md); false = v1.2 fallback
    peak_max_bars: 10
    peak_min_atr_mult: 1.0
    retest_confirm_max_bars: 15
    retest_max_depth_atr_mult: 1.0            # spec_v2 §2 buoc 3: thung sau -> huy setup
    breakout2_max_bars: 10
    require_retest_confirmation: true
    sl_buffer_atr_mult: 0.3
    min_stop_atr_mult: 1.0                   # guard chong-1-nen: reject if 1R too small
    max_sl_atr_mult: 3.0                     # guard: reject if 1R too large
    scoring_enabled: true
    scoring_threshold_ratio: 0.66            # ~ 8/12
    scoring_secondary_threshold_ratio: 0.5   # ~ 6/12: pass only if A1+B1+C1 == 5 (spec_v2 §5)
  mean_reversion:
    enabled: true
    rsi_period: 14
    rsi_overbought: 70.0
    rsi_oversold: 30.0
    mr_sl_atr_period: 5
    mr_sl_atr_mult: 1.0

filters:
  trend:
    enabled: true
    ema_fast: 34
    ema_slow: 89
  adx_filter:
    enabled: true
    period: 14
    threshold_trend: 25.0                   # was 30: ADX lags trend starts; 30 starved breakouts
    threshold_range: 23.0
  er_filter:
    enabled: true
    period: 10
    threshold_trend: 0.35                   # was 0.6: near-unreachable jointly with ADX-trend
    threshold_range: 0.30
  atr_ref:
    enabled: true
    locked: true
    period14: 14
    period5: 5
  atr_zscore:
    enabled: true
    window: 100
    z_off_low: -1.5
    z_breakout_only: 2.0
    z_mid_low: 1.0
    sl_scale_high: 1.5
    sl_scale_mid: 1.2                       # was 1.5 (== high, made the mid band pointless)
    sl_scale_normal: 1.0
  volume:
    enabled: false                          # off for FOREX
    period: 20
    multiplier: 1.5
  session:
    enabled: true
    forex_crypto:
      - tz: Europe/London
        start: "08:00"
        end: "17:00"
      - tz: America/New_York
        start: "08:00"
        end: "17:00"
    stock_vn:
      - tz: Asia/Ho_Chi_Minh
        start: "09:00"
        end: "11:30"
      - tz: Asia/Ho_Chi_Minh
        start: "13:00"
        end: "14:30"
  mtf:
    enabled: true
    block_on_neutral: false
  dxy:
    enabled: true
    change_threshold_pct: 0.2
    lookback_hours: 1
  confirmation_lag:
    enabled: true
  equity_curve:
    enabled: true
    win_streak_trigger: 3
    loss_streak_trigger: 2
    win_reduce_to: 0.5
    loss_reduce_to: 0.3
  time_stop:
    enabled: true
    bars: 16                                # timeframe-aware budget (bars x tf duration)
    hours: 8.0                              # fallback when bars is null
    after_tp1: false                        # C5
  range_width:
    enabled: true
    atr_mult: 2.5                             # spec_v2 §3 (was 1.5 from D3, v1.2 had no number)
  account_risk:
    enabled: true
    max_concurrent_trades: 3
    daily_max_losses: 3
    daily_loss_limit_enabled: true
    one_trade_per_symbol: true               # Phase 1/2 gap default
  wick:
    enabled: true
    min_ratio: 0.33                          # D4 revised (0.5 = rare pin-bar, starved trades)
  news:
    enabled: false
    min_impact: high
    window_before_min: 30
    window_after_min: 30
