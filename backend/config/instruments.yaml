# Instrument specs. Gap table default (docs/decisions.md): spread 0 for hand-checkable tests.
instruments:
  EURUSD:
    symbol: EURUSD
    symbol_type: FOREX
    contract_size: 100000
    pip: 0.0001
    pip_value_per_lot: 10.0
    spread_pips: 0.0
    min_lot: 0.01
    lot_step: 0.01
    synthetic_start_price: 1.1000
    currencies: [EUR, USD]
  GBPUSD:
    symbol: GBPUSD
    symbol_type: FOREX
    contract_size: 100000
    pip: 0.0001
    pip_value_per_lot: 10.0
    spread_pips: 0.0
    min_lot: 0.01
    lot_step: 0.01
    synthetic_start_price: 1.2700
    currencies: [GBP, USD]
  # pip = 0.01 (100x EURUSD) -- the whole reason instrument spec had to move per-symbol
  # (plan 04): using the global EURUSD spec here would size lots ~100x too small.
  # synthetic_start_price must be JPY-scale too (~110), or sl_distance/pip produces a
  # tiny pip count against a real risk_amount and wildly over-sizes the lot.
  USDJPY:
    symbol: USDJPY
    symbol_type: FOREX
    contract_size: 100000
    pip: 0.01
    pip_value_per_lot: 9.09  # ~10 USD/pip/lot at ~110 USDJPY, held fixed for determinism
    spread_pips: 0.0
    min_lot: 0.01
    lot_step: 0.01
    synthetic_start_price: 110.00
    currencies: [USD, JPY]
  # Invariant (sizing vs P&L consistency): pip_value_per_lot MUST equal
  # pip x contract_size in account currency (USD) — risk_manager sizes lots from
  # pip_value_per_lot but OrderEngine._pnl_amount realizes P&L as move x lot x
  # contract_size with no conversion. A mismatch skews realized risk by exactly
  # that ratio (XAUUSD shipped with 1.0 instead of 10.0 -> 10x oversized lots).
  XAUUSD:
    symbol: XAUUSD
    symbol_type: FOREX
    contract_size: 100
    pip: 0.1
    pip_value_per_lot: 10.0  # = pip (0.1) x contract_size (100)
    spread_pips: 0.0
    min_lot: 0.01
    lot_step: 0.01
    synthetic_start_price: 1900.0
    currencies: [XAU, USD]

  # ---------------------------------------------------------------------------
  # Crypto perpetual futures (plan 07). Binance USDⓈ-M: the contract is 1 coin, quoted
  # and settled in USDT, so contract_size = 1 and P&L is already in the account
  # currency. `pip` is the venue tick size; pip_value_per_lot = pip x contract_size
  # keeps the sizing/P&L invariant (see the XAUUSD note above).
  # min_lot/lot_step mirror the exchange LOT_SIZE filter (BTC 0.001, ETH 0.001).
  # NOTE: order_engine prices these trades from bar data only -- perpetual FUNDING FEE
  # is not modelled (deviation, docs/decisions.md); plan 12a adds it.
  # ---------------------------------------------------------------------------
  BTCUSDT:
    symbol: BTCUSDT
    symbol_type: CRYPTO
    contract_size: 1
    pip: 0.1
    pip_value_per_lot: 0.1      # = pip (0.1) x contract_size (1)
    spread_pips: 0.0
    min_lot: 0.001
    lot_step: 0.001
    synthetic_start_price: 60000.0
    currencies: [BTC, USDT]
  ETHUSDT:
    symbol: ETHUSDT
    symbol_type: CRYPTO
    contract_size: 1
    pip: 0.01
    pip_value_per_lot: 0.01     # = pip (0.01) x contract_size (1)
    spread_pips: 0.0
    min_lot: 0.001
    lot_step: 0.001
    synthetic_start_price: 3000.0
    currencies: [ETH, USDT]

  # ---------------------------------------------------------------------------
  # Stock VN (plan 05). Prices and P&L are in VND: an all-VN portfolio runs a VND
  # account (`starting_equity` read as VND, mixing with FOREX/CRYPTO rejected by
  # BotConfig) precisely so no currency conversion is needed anywhere.
  #
  # `min_lot = lot_step = 1` is what makes calculate_lot return WHOLE lots -- it
  # already floors to lot_step and returns 0 below min_lot, so no special-casing.
  # The same sizing-vs-P&L invariant as above applies: pip_value_per_lot ==
  # pip x contract_size. HOSE tick sizes (50/100/500 VND bands) are NOT modelled --
  # raw CSV prices are used (user decision 2026-07-22, deviation in decisions.md).
  # ---------------------------------------------------------------------------
  # Cash equity: 1 lot = 100 shares, price quoted in VND per share.
  HPG:
    symbol: HPG
    symbol_type: STOCK_VN_CASH
    contract_size: 100          # shares per lot (HOSE round lot)
    pip: 1.0                    # 1 VND of share price
    pip_value_per_lot: 100.0    # = pip (1) x contract_size (100)
    spread_pips: 0.0
    min_lot: 1                  # whole lots only
    lot_step: 1
    synthetic_start_price: 27000.0
    currencies: [VND]
  FPT:
    symbol: FPT
    symbol_type: STOCK_VN_CASH
    contract_size: 100
    pip: 1.0
    pip_value_per_lot: 100.0
    spread_pips: 0.0
    min_lot: 1
    lot_step: 1
    synthetic_start_price: 95000.0
    currencies: [VND]
  # VN30 index future: multiplier 100,000 VND per index point, 1 contract per lot,
  # tick 0.1 point. Margin is NOT simulated (deviation) -- sizing is pure
  # MAX_RISK_PER_TRADE like every other instrument.
  VN30F1M:
    symbol: VN30F1M
    symbol_type: STOCK_VN_DERIV
    contract_size: 100000       # VND per index point
    pip: 0.1                    # tick = 0.1 index point
    pip_value_per_lot: 10000.0  # = pip (0.1) x contract_size (100000)
    spread_pips: 0.0
    min_lot: 1                  # whole contracts only
    lot_step: 1
    synthetic_start_price: 1250.0
    currencies: [VND]
