[project]
name = "bot"
version = "0.1.0"
description = "Multi-strategy trading bot (Breakout-Retest + Mean Reversion) — Phase 1, mock data"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "mypy>=1.10",
    "ruff>=0.4",
    "black>=24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false
files = ["src/bot"]

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "yaml.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) in argument defaults is the required, idiomatic DI pattern.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py310"]
