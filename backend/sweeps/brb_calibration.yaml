# Plan 11 ❓1 — BA TRỤC CẤU TRÚC còn lại (ngưỡng điểm số đo riêng ở
# `brb_threshold_eurusd_1h.yaml` vì nó cần cùng một cửa sổ dài nhưng chỉ 1 trục).
#
# CẢNH BÁO (plan 11 ❓1 điểm (a)): KHÔNG chạy spec này trên dataset synthetic. Trên
# random-walk, A1 (thân > 2×SMA10) đạt 3/23 và B2 (engulfing) 0/23 ⇒ trần điểm thực tế
# 6/10 — sweep ở đó chỉ đo bộ sinh số ngẫu nhiên.
#
# Ngưỡng điểm số ghim ở 0.50 trong `base_patch`: đo trên 8.5 năm cho thấy đó là giá trị
# cho profit factor cao nhất trong dải ❓1 (1.67 / 7 lệnh) trước khi ≥0.55 bóp tần suất
# xuống 4 lệnh / 8.5 năm. Ghim để ba trục dưới đây đo được — KHÔNG phải vì 0.50 đã được
# chọn (không tổ hợp nào đạt ràng buộc N≥30; xem docs/decisions.md mục Plan 11).
name: brb-structure-eurusd-1h
dataset: c5f07f66b687b346    # EURUSD 1H thật (data/csv/EURUSD_real_1h.csv)
symbol: EURUSD
timeframe: "1H"
from: "2018-01-01"
to: "2026-07-01"

axes:
  strategies.breakout.peak_min_atr_mult: [0.7, 1.0, 1.3]
  strategies.breakout.retest_max_depth_atr_mult: [0.5, 1.0, 1.5]
  strategies.breakout.max_sl_atr_mult: [2.5, 3.0, 3.5]

# Xem `brb_threshold_eurusd_1h.yaml` để biết vì sao phải kéo nền về cấu hình hiện hành.
base_patch:
  strategies:
    breakout:
      range_period: 30
      scoring_threshold_ratio: 0.50
  filters:
    range_width:
      atr_mult: 2.5
    session:
      enabled: true
  execution:
    costs:
      spread_pips: 1.0
      slippage_pips: 0.5

# ❓2 chốt bởi user 2026-07-30.
selection:
  metric: profit_factor
  max_drawdown_pct: 20.0
  min_trades: 30
